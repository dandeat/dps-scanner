<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Monitor Pro</title>

    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Barcode Scanning & Text-to-Speech Libraries -->
    <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
    <script src="https://unpkg.com/@zxing/browser@latest/umd/zxing-browser.min.js"></script>
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=YfaIuqy2"></script>

    <!-- Custom Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* A little custom CSS to complement Tailwind */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbar for a better dark mode experience */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        /* Animation for newly added history items */
        .history-item-enter {
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .history-item-enter-active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-200 antialiased">

    <!-- Setup Screen -->
    <div id="setupScreen" class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-md space-y-4 text-center">
            <h1 class="text-3xl font-bold text-white">Scan Monitor</h1>
            <p class="text-gray-400">Enter your session ID to begin.</p>
            <input type="text" id="sessionInput" placeholder="e.g., session123"
                class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
            <button id="loadMuatListBtn"
                class="w-full px-4 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 active:bg-blue-800 transition-colors shadow-lg">
                Continue
            </button>
            <button id="openDashboardBtn"
                class="w-full px-4 py-3 bg-gray-700 text-white font-semibold rounded-lg hover:bg-gray-600 active:bg-gray-800 transition-colors">
                Open Dashboard
            </button>

            <!-- Muat Selection (hidden by default) -->
            <div id="muatSelection" class="hidden flex-col items-center gap-4 pt-6 w-full">
                <h3 class="text-xl font-semibold text-white">Select Load</h3>
                <select id="muatDropdown"
                    class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition"></select>
                <div class="flex gap-2 w-full">
                    <button id="addMuatBtn"
                        class="w-1/2 px-4 py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 active:bg-green-800 transition-colors">
                        + Add New
                    </button>
                    <button id="startMonitoringBtn"
                        class="w-1/2 px-4 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 active:bg-blue-800 transition-colors">
                        Start Scanning
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scanner Screen -->
    <main id="scannerScreen" class="hidden min-h-screen w-full p-4 gap-4 lg:h-screen">
        <!-- Left Column -->
        <div class="flex-grow flex flex-col gap-4 w-full lg:w-2/3">
            <!-- Barcode Display -->
            <div id="barcodeDisplay"
                class="flex items-center justify-center p-6 bg-gray-800 rounded-xl text-yellow-400 text-2xl md:text-4xl font-bold break-all min-h-[100px]">
                Scan a barcode to begin...
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                <button id="openManualScanBtn"
                    class="px-4 py-3 bg-yellow-500 text-black font-semibold rounded-lg hover:bg-yellow-600 transition-colors">Manual
                    Scan</button>
                <button id="openCameraScannerBtn"
                    class="px-4 py-3 bg-teal-500 text-white font-semibold rounded-lg hover:bg-teal-600 transition-colors">Camera
                    Scan</button>
                <button id="openFilterBtn"
                    class="px-4 py-3 bg-purple-600 text-white font-semibold rounded-lg hover:bg-purple-700 transition-colors">Filter</button>
            </div>
            <div id="currentFilter" class="p-3 bg-gray-800 text-center text-gray-300 rounded-lg">Filter: All</div>


            <!-- Scan Details -->
            <div id="scanDetails"
                class="flex-grow p-6 bg-gray-800 rounded-xl whitespace-pre-wrap text-base md:text-lg leading-relaxed transition-colors duration-300">
                Waiting for server data...
            </div>
        </div>

        <!-- Right Column (History) -->
        <aside class="w-full lg:w-1/3 bg-gray-800 rounded-xl p-4 flex flex-col h-80 lg:h-auto">
            <h3 class="text-xl font-bold text-white mb-4 pb-2 border-b border-gray-700">Scan History</h3>
            <div id="historyList" class="flex-grow overflow-y-auto space-y-2 pr-2">
                <!-- History items will be injected here -->
            </div>
        </aside>
    </main>

    <!-- Modals -->
    <div id="modal-container">
        <!-- Manual Scan Modal -->
        <div id="manualScanModal"
            class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center z-50 p-4">
            <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md space-y-4 relative">
                <button
                    class="close-modal-btn absolute top-3 right-3 text-gray-400 hover:text-white text-3xl">&times;</button>
                <h2 class="text-2xl font-bold text-white">Manual Package Code</h2>
                <input type="text" id="manualScanInput" placeholder="Type code and press Enter..."
                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                <button id="submitManualScanBtn"
                    class="w-full px-4 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors">Submit</button>
            </div>
        </div>

        <!-- Filter Modal -->
        <div id="filterModal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center z-50 p-4">
            <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md space-y-4 relative">
                <button
                    class="close-modal-btn absolute top-3 right-3 text-gray-400 hover:text-white text-3xl">&times;</button>
                <h2 class="text-2xl font-bold text-white">Filter Load Criteria</h2>
                <select id="kriteriaDropdown"
                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition"></select>
                <button id="saveFilterBtn"
                    class="w-full px-4 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors">Save
                    Filter</button>
            </div>
        </div>

        <!-- Camera Scanner Modal -->
        <div id="cameraModal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center z-50 p-4">
            <div class="bg-gray-800 rounded-xl p-6 w-full max-w-lg space-y-4 relative">
                <button
                    class="close-modal-btn absolute top-3 right-3 text-gray-400 hover:text-white text-3xl">&times;</button>
                <h2 class="text-2xl font-bold text-white">Scan with Camera</h2>
                <video id="cameraFeed" class="w-full rounded-lg bg-black"></video>
                <p class="text-center text-gray-400">Point the camera at a barcode</p>
            </div>
        </div>
    </div>

    <!-- Custom Toast/Notification -->
    <div id="toast"
        class="fixed bottom-5 right-5 bg-red-600 text-white px-6 py-3 rounded-lg shadow-xl opacity-0 translate-y-4 transition-all duration-300">
        This is a toast message!
    </div>


    <script>
        // Wait for the entire page to load before running the script
        window.addEventListener('load', () => {

            // --- STATE MANAGEMENT ---
            // Centralized state for the application
            const AppState = {
                sessionId: "",
                muatId: "",
                scanBuffer: "",
                lastKeyTime: Date.now(),
                currentBarcode: "",
                websocket: null,
                kriteriaMuat: 0,
                kriteriaMap: {},
                cameraCodeReader: null,
                isCameraScanning: false,
            };

            // --- DOM ELEMENT SELECTORS ---
            // Grouping all DOM element lookups for easy management
            const DOMElements = {
                setupScreen: document.getElementById('setupScreen'),
                scannerScreen: document.getElementById('scannerScreen'),
                sessionInput: document.getElementById('sessionInput'),
                loadMuatListBtn: document.getElementById('loadMuatListBtn'),
                openDashboardBtn: document.getElementById('openDashboardBtn'),
                muatSelection: document.getElementById('muatSelection'),
                muatDropdown: document.getElementById('muatDropdown'),
                addMuatBtn: document.getElementById('addMuatBtn'),
                startMonitoringBtn: document.getElementById('startMonitoringBtn'),
                barcodeDisplay: document.getElementById('barcodeDisplay'),
                scanDetails: document.getElementById('scanDetails'),
                historyList: document.getElementById('historyList'),
                currentFilter: document.getElementById('currentFilter'),
                toast: document.getElementById('toast'),
                modals: {
                    manual: document.getElementById('manualScanModal'),
                    filter: document.getElementById('filterModal'),
                    camera: document.getElementById('cameraModal'),
                },
                inputs: {
                    manualScan: document.getElementById('manualScanInput'),
                    kriteriaDropdown: document.getElementById('kriteriaDropdown'),
                },
                buttons: {
                    openManualScan: document.getElementById('openManualScanBtn'),
                    openCameraScanner: document.getElementById('openCameraScannerBtn'),
                    openFilter: document.getElementById('openFilterBtn'),
                    submitManualScan: document.getElementById('submitManualScanBtn'),
                    saveFilter: document.getElementById('saveFilterBtn'),
                },
                cameraFeed: document.getElementById('cameraFeed'),
            };

            // --- UTILITY FUNCTIONS ---
            const Utils = {
                /**
                 * Speaks the given text using the ResponsiveVoice library.
                 * @param {string} text - The text to be spoken.
                 */
                speak: (text) => {
                    if (typeof responsiveVoice !== 'undefined') {
                        responsiveVoice.speak(text, "Indonesian Female");
                    } else {
                        console.warn("ResponsiveVoice library not loaded.");
                    }
                },
                /**
                 * Plays a short beep sound using the Web Audio API.
                 */
                playBeep: () => {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.1);
                },
                /**
                 * Displays a toast notification.
                 * @param {string} message - The message to display.
                 * @param {string} type - 'error' or 'success'.
                 */
                showToast: (message, type = 'error') => {
                    const toast = DOMElements.toast;
                    toast.textContent = message;
                    toast.className = `fixed bottom-5 right-5 text-white px-6 py-3 rounded-lg shadow-xl transition-all duration-300 ${type === 'error' ? 'bg-red-600' : 'bg-green-600'}`;
                    toast.style.opacity = '1';
                    toast.style.transform = 'translateY(0)';
                    setTimeout(() => {
                        toast.style.opacity = '0';
                        toast.style.transform = 'translateY(1rem)';
                    }, 3000);
                }
            };

            // --- API & DATA HANDLING ---
            const API = {
                /**
                 * Fetches the list of "muat" (loads) from the server.
                 * @returns {Promise<Array>} A promise that resolves with the list of loads.
                 */
                fetchMuatList: async () => {
                    const response = await fetch("/muat-list");
                    if (!response.ok) throw new Error('Failed to fetch muat list');
                    return response.json();
                },
                /**
                 * Adds a new "muat" (load) to the server.
                 * @param {object} data - The data for the new load {nopol, driver, tujuan}.
                 * @returns {Promise<Response>} The fetch response.
                 */
                addMuat: async (data) => {
                    return fetch("/tambah-muat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data)
                    });
                },
                /**
                 * Fetches the list of "kriteria" (criteria) from the server.
                 * @returns {Promise<Array>} A promise that resolves with the list of criteria.
                 */
                fetchKriteriaList: async () => {
                    const response = await fetch("/kriteria-list");
                    if (!response.ok) throw new Error('Failed to fetch kriteria list');
                    return response.json();
                },
                /**
                 * Sends a scanned barcode to the server.
                 * @param {string} barcode - The barcode string to send.
                 */
                sendScan: (barcode) => {
                    if (!AppState.sessionId || !AppState.muatId) return;
                    AppState.currentBarcode = barcode;
                    fetch("/scan", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            session_id: AppState.sessionId,
                            muat_id: AppState.muatId,
                            barcode: barcode,
                            kriteria_muat: Number(AppState.kriteriaMuat) || 0   // <-- guaranteed int
                        })
                    }).catch(error => {
                        console.error("Failed to send scan:", error);
                        Utils.showToast("Failed to send scan to server.");
                    });
                }

            };

            // --- UI UPDATE FUNCTIONS ---
            const UI = {
                /**
                 * Updates the main scan details panel based on server response.
                 * @param {object} response - The parsed JSON response from the WebSocket.
                 */
                updateScanDetails: (response) => {
                    const data = response.data || {};
                    const detailsDiv = DOMElements.scanDetails;

                    // Reset status styles
                    detailsDiv.classList.remove("bg-green-700", "bg-yellow-700", "bg-red-700", "bg-gray-500", "border-l-4", "border-green-500", "border-yellow-500", "border-red-500");

                    let statusColorClass = "bg-gray-800";
                    let statusBorderClass = [];
                    let speakText = "";

                    const noKemasan = data.barcode || AppState.currentBarcode;
                    DOMElements.barcodeDisplay.textContent = noKemasan;

                    switch (data.status_scan) {
                        case "approved":
                            statusColorClass = "bg-green-700";
                            statusBorderClass = ["border-l-4", "border-green-500"];
                            speakText = "Disetujui";
                            break;
                        case "kuning":
                            statusColorClass = "bg-yellow-700";
                            statusBorderClass = ["border-l-4", "border-yellow-500"];
                            speakText = data.status_desc || "Periksa";
                            break;
                        case "rejected":
                            statusColorClass = "bg-red-700";
                            statusBorderClass = ["border-l-4", "border-red-500"];
                            speakText = `Ditolak. ${data.status_desc || ""}`;
                            break;
                        case "abu":
                            statusColorClass = "bg-gray-700";
                            statusBorderClass = ["border-l-4", "border-gray-500"];
                            speakText = `${data.status_desc || ""}`;
                    }

                    // Use the spread operator '...' to add classes from the array
                    if (statusBorderClass.length > 0) {
                        detailsDiv.classList.add(statusColorClass, ...statusBorderClass);
                    } else {
                        detailsDiv.classList.add(statusColorClass);
                    }


                    detailsDiv.textContent = `
📦 Status       : ${data.status_scan?.toUpperCase() || "UNKNOWN"}
📝 Deskripsi    : ${data.status_desc || "-"}
🔢 Barcode      : ${noKemasan || "-"}
📦 Kemasan      : ${data.no_kemasan || "-"}
📄 SPPB         : ${data.no_sppb || "-"} (${data.tgl_sppb || "-"})
🔍 HasilPeriksa : ${data.hasil_periksa || "-"}
🚪 GateIn       : ${data.waktu_gate_in || "-"}
🚪 GateOut      : ${data.waktu_gate_out || "-"}
📍 Provinsi     : ${data.provinsi_penerima || "-"}
                    `.trim();

                    UI.updateHistory(noKemasan, data.status_scan);
                    if (speakText) Utils.speak(speakText);
                },
                /**
                 * Adds a new item to the scan history list.
                 * @param {string} barcode - The scanned barcode.
                 * @param {string} status - The scan status ('approved', 'rejected', etc.).
                 */
                updateHistory: (barcode, status) => {
                    const historyItem = document.createElement("div");
                    let statusClass = "bg-gray-700";
                    if (status === "approved") statusClass = "bg-green-600";
                    if (status === "rejected") statusClass = "bg-red-600";
                    if (status === "kuning") statusClass = "bg-yellow-500 text-black";
                    if (status === "abu") statusClass = "bg-gray-500"

                    historyItem.className = `p-2 rounded-md text-sm font-mono truncate history-item-enter ${statusClass}`;
                    historyItem.textContent = barcode;

                    DOMElements.historyList.prepend(historyItem);

                    // Trigger the animation
                    requestAnimationFrame(() => {
                        historyItem.classList.add('history-item-enter-active');
                    });
                }
            };

            // --- MODAL MANAGEMENT ---
            const Modal = {
                /**
                 * Opens a specified modal.
                 * @param {HTMLElement} modalElement - The modal element to open.
                 */
                open: (modalElement) => {
                    modalElement.classList.remove('hidden');
                    modalElement.classList.add('flex');
                },
                /**
                 * Closes a specified modal.
                 * @param {HTMLElement} modalElement - The modal element to close.
                 */
                close: (modalElement) => {
                    modalElement.classList.add('hidden');
                    modalElement.classList.remove('flex');
                },
                /**
                 * Closes all currently open modals.
                 */
                closeAll: () => {
                    Object.values(DOMElements.modals).forEach(modal => Modal.close(modal));
                    Scanner.stopCamera(); // Ensure camera is stopped if any modal is closed
                }
            };

            // --- SCANNER LOGIC ---
            const Scanner = {
                /**
                 * Handles input from a physical (keyboard wedge) barcode scanner.
                 * @param {KeyboardEvent} e - The keydown event.
                 */
                handlePhysicalScan: (e) => {
                    if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT') {
                        return;
                    }
                    const now = Date.now();
                    if (now - AppState.lastKeyTime > 200) AppState.scanBuffer = "";
                    AppState.lastKeyTime = now;

                    if (e.key === "Enter") {
                        if (AppState.scanBuffer) {
                            const cleanBuffer = AppState.scanBuffer.trim().toUpperCase();
                            if (cleanBuffer) API.sendScan(cleanBuffer);
                            AppState.scanBuffer = "";
                        }
                    } else if (e.key.length === 1) {
                        AppState.scanBuffer += e.key;
                    }
                },
                /**
                 * Initializes and starts the camera scanner.
                 */
                startCamera: async () => {
                    if (AppState.isCameraScanning) return;

                    const hints = new Map();
                    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39]);
                    AppState.cameraCodeReader = new ZXing.BrowserMultiFormatReader(hints);
                    AppState.isCameraScanning = true;
                    Modal.open(DOMElements.modals.camera);

                    try {
                        const videoInputDevices = await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
                        if (videoInputDevices.length === 0) {
                            throw new Error("No camera found.");
                        }

                        // Prefer the back camera
                        const rearCamera = videoInputDevices.find(device => device.label.toLowerCase().includes('back')) || videoInputDevices[0];

                        AppState.cameraCodeReader.decodeFromVideoDevice(rearCamera.deviceId, DOMElements.cameraFeed, (result, err) => {
                            if (result && AppState.isCameraScanning) {
                                Utils.playBeep();
                                API.sendScan(result.text);
                                // Pause scanning briefly to prevent multiple scans of the same code
                                AppState.isCameraScanning = false;
                                setTimeout(() => { AppState.isCameraScanning = true; }, 2000);
                            }
                            if (err && !(err instanceof ZXing.NotFoundException)) {
                                console.error("Camera scan error:", err);
                                Utils.showToast("Camera scanning error.");
                                Scanner.stopCamera();
                            }
                        });
                    } catch (err) {
                        console.error("Error initializing camera:", err);
                        Utils.showToast(err.message || "Could not access camera. Please grant permission.");
                        Scanner.stopCamera();
                    }
                },
                /**
                 * Stops the camera scanner and resets its state.
                 */
                stopCamera: () => {
                    if (AppState.cameraCodeReader) {
                        AppState.cameraCodeReader.reset();
                        AppState.cameraCodeReader = null;
                    }
                    AppState.isCameraScanning = false;
                    Modal.close(DOMElements.modals.camera);
                }
            };

            // --- WEBSOCKET HANDLING ---
            function connectWebSocket() {
                const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                AppState.websocket = new WebSocket(`${wsProtocol}//${window.location.host}/ws/${AppState.sessionId}`);

                AppState.websocket.onopen = () => {
                    console.log("WebSocket connection established.");
                    Utils.speak("Siap menerima scan");
                };

                AppState.websocket.onmessage = (event) => {
                    try {
                        const response = JSON.parse(event.data);
                        UI.updateScanDetails(response);
                    } catch (error) {
                        console.error("Failed to parse WebSocket message:", error);
                    }
                };

                AppState.websocket.onclose = () => {
                    console.log("WebSocket connection closed. Reconnecting in 5s...");
                    setTimeout(connectWebSocket, 5000);
                };

                AppState.websocket.onerror = (error) => {
                    console.error("WebSocket error:", error);
                };
            }

            // --- APPLICATION LOGIC & EVENT HANDLERS ---

            /**
             * Handles the initial loading of the muat list.
             */
            async function handleLoadMuatList() {
                AppState.sessionId = DOMElements.sessionInput.value.trim();
                if (!AppState.sessionId) return Utils.showToast("Session ID is required.");

                DOMElements.sessionInput.disabled = true;
                DOMElements.loadMuatListBtn.textContent = "Loading...";
                DOMElements.loadMuatListBtn.disabled = true;

                try {
                    const data = await API.fetchMuatList();
                    DOMElements.muatDropdown.innerHTML = "";
                    data.forEach(m => {
                        const option = document.createElement("option");
                        option.value = m.id;
                        option.textContent = `${m.nopol} - ${m.driver} - ${m.tujuan}`;
                        DOMElements.muatDropdown.appendChild(option);
                    });
                    DOMElements.muatSelection.classList.remove('hidden');
                    DOMElements.muatSelection.classList.add('flex');
                    DOMElements.loadMuatListBtn.style.display = "none";
                } catch (error) {
                    console.error(error);
                    Utils.showToast("Failed to load list. Check console.");
                    DOMElements.sessionInput.disabled = false;
                    DOMElements.loadMuatListBtn.textContent = "Continue";
                    DOMElements.loadMuatListBtn.disabled = false;
                }
            }

            /**
             * Handles adding a new muat.
             */
            async function handleAddMuat() {
                const nopol = prompt("Enter No Pol:");
                const driver = prompt("Enter Driver Name:");
                const tujuan = prompt("Enter Destination:");

                if (!nopol || !driver || !tujuan) return Utils.showToast("All fields are required!");

                try {
                    const res = await API.addMuat({ nopol, driver, tujuan });
                    if (res.ok) {
                        Utils.showToast("Load added successfully.", 'success');
                        handleLoadMuatList(); // Refresh list
                    } else {
                        throw new Error('Server responded with an error.');
                    }
                } catch (error) {
                    console.error(error);
                    Utils.showToast("Failed to add load.");
                }
            }

            /**
             * Handles opening the filter modal and fetching criteria.
             */
            async function handleOpenFilterModal() {
                Modal.open(DOMElements.modals.filter);
                DOMElements.inputs.kriteriaDropdown.innerHTML = '<option>Loading...</option>';
                try {
                    const kriteriaList = await API.fetchKriteriaList();
                    DOMElements.inputs.kriteriaDropdown.innerHTML = '';
                    AppState.kriteriaMap = {};

                    // add Semua Filter Option
                    const allOption = document.createElement('option');
                    allOption.value = 0; // Assuming 0 is the ID for "Semua"
                    allOption.textContent = "Semua Kriteria";
                    AppState.kriteriaMap[0] = "Semua"
                    DOMElements.inputs.kriteriaDropdown.appendChild(allOption);

                    // Populate dropdown with criteria
                    kriteriaList.forEach(k => {
                        console.log("Feach :: ", k)
                        const option = document.createElement('option');
                        option.value = k.id;
                        option.textContent = `[${k.name}] ${k.uraian}`;
                        AppState.kriteriaMap[k.id] = k.name; // Store name for display
                        if (k.id === AppState.kriteriaMuat) {
                            option.selected = true;
                        }
                        DOMElements.inputs.kriteriaDropdown.appendChild(option);
                    });
                    // kriteriaList.forEach(k => {
                    //     const option = document.createElement('option');
                    //     option.value = String(k.id);
                    //     option.textContent = `[${k.name}] ${k.uraian}`;
                    //     AppState.kriteriaMap[Number(k.id)] = k.name;               // map with numeric key
                    //     if (Number(k.id) === Number(AppState.kriteriaMuat)) {
                    //         option.selected = true;
                    //     }
                    // });
                } catch (error) {
                    console.error("Failed to fetch criteria:", error);
                    DOMElements.inputs.kriteriaDropdown.innerHTML = '<option>Failed to load</option>';
                }
            }

            /**
             * Saves the selected filter.
             */
            function handleSaveFilter() {
                const selectedId = parseInt(DOMElements.inputs.kriteriaDropdown.value, 10) || 0;
                AppState.kriteriaMuat = selectedId;                   // <-- now a number
                const filterName = AppState.kriteriaMap[selectedId] || "Unknown";
                // alert(`Filter changed to: ${selectedId} - ${filterName}`);
                DOMElements.currentFilter.textContent = `Filter: ${filterName}`;
                Utils.showToast(`Filter changed to: ${filterName}`, 'success');
                Utils.speak(`Filter diubah menjadi ${filterName}`);
                Modal.close(DOMElements.modals.filter);
            }

            /**
             * Main function to initialize the application and set up event listeners.
             */
            function initializeApp() {
                // Setup Screen
                DOMElements.loadMuatListBtn.addEventListener('click', handleLoadMuatList);
                DOMElements.openDashboardBtn.addEventListener('click', () => window.location.href = '/ui/dashboard.html');
                DOMElements.addMuatBtn.addEventListener('click', handleAddMuat);
                DOMElements.startMonitoringBtn.addEventListener('click', () => {
                    AppState.muatId = DOMElements.muatDropdown.value;
                    if (!AppState.muatId) return Utils.showToast("A load must be selected.");
                    DOMElements.setupScreen.classList.add('hidden');
                    DOMElements.scannerScreen.classList.remove('hidden');
                    DOMElements.scannerScreen.classList.add('flex', 'flex-col', 'lg:flex-row');
                    connectWebSocket();
                });

                // Scanner Screen Actions
                DOMElements.buttons.openManualScan.addEventListener('click', () => {
                    Modal.open(DOMElements.modals.manual);
                    DOMElements.inputs.manualScan.focus();
                });
                DOMElements.buttons.openCameraScanner.addEventListener('click', Scanner.startCamera);
                DOMElements.buttons.openFilter.addEventListener('click', handleOpenFilterModal);

                // Modal Actions
                DOMElements.buttons.submitManualScan.addEventListener('click', () => {
                    const code = DOMElements.inputs.manualScan.value.trim().toUpperCase();
                    if (code) {
                        API.sendScan(code);
                        DOMElements.inputs.manualScan.value = '';
                        Modal.close(DOMElements.modals.manual);
                    } else {
                        Utils.showToast("Package code cannot be empty.");
                    }
                });
                DOMElements.inputs.manualScan.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        DOMElements.buttons.submitManualScan.click();
                    }
                });
                DOMElements.buttons.saveFilter.addEventListener('click', handleSaveFilter);

                // Global Event Listeners
                document.addEventListener("keydown", Scanner.handlePhysicalScan);

                // Close modals with close buttons or by clicking the background
                document.querySelectorAll('.close-modal-btn').forEach(btn => btn.addEventListener('click', Modal.closeAll));
                Object.values(DOMElements.modals).forEach(modal => {
                    modal.addEventListener('click', (e) => {
                        if (e.target === modal) Modal.closeAll();
                    });
                });
            }

            // Start the application
            initializeApp();
        });
    </script>
</body>
